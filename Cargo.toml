[workspace]
resolver = "3"
members = [
  "crates/iris-core",
  "crates/iris-config",
  "crates/iris-db",
  "crates/iris-auth",
  "crates/iris-providers",
  "crates/iris-torrent",
  "crates/iris-media",
  "crates/iris-caps",
  "crates/iris-reco",
  "crates/iris-api",
]

[workspace.package]
version = "1.3.5"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# Local crates
iris-core = { path = "crates/iris-core" }
iris-config = { path = "crates/iris-config" }
iris-db = { path = "crates/iris-db" }
iris-auth = { path = "crates/iris-auth" }
iris-providers = { path = "crates/iris-providers" }
iris-torrent = { path = "crates/iris-torrent" }
iris-media = { path = "crates/iris-media" }
iris-caps = { path = "crates/iris-caps" }
iris-reco = { path = "crates/iris-reco" }

# Async runtime + http
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
futures = "0.3.32"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "http2"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie", "cookie-private"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "trace",
  "cors",
  "fs",
  "compression-gzip",
  "set-header",
  "normalize-path",
] }
hyper = "1.10.1"
http = "1.4.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "gzip",
  "brotli",
  "stream",
  "http2",
  # Cookie-session trackers (hdtorrents) — no API, auth lives in the jar
  # and login is a classic urlencoded form POST.
  "cookies",
  "form",
] }
bytes = "1.11.1"
# Mozilla's CA root bundle, compiled into the binary — so outbound TLS trust
# doesn't depend on the (stale/incomplete) CA store of the Wolfi runtime image.
webpki-root-certs = "1.0.8"

# Serde / config
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
figment = { version = "0.10.19", features = ["toml", "env"] }

# OpenAPI — utoipa derives the spec from the route handlers + serde types.
# The spec is the BE↔FE↔TV contract as a build artifact (generated TS via
# openapi-typescript, Kotlin via openapi-generator) instead of hand-kept
# discipline. `axum_extras` teaches `#[utoipa::path]` about axum extractors.
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }

# DB (latest stable)
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "macros",
  "migrate",
  "uuid",
  "chrono",
] }

# Auth (latest stable; argon2 0.6 is rc)
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.1"

# Errors / logging
thiserror = "2.0.18"
anyhow = "1.0.103"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Utility
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
url = { version = "2.5.8", features = ["serde"] }
quick-xml = "0.41.0"
# HTML scraping for API-less trackers (hdtorrents). `deterministic` keeps
# attribute order (IndexMap) — HD-Torrents hides the upload date in unquoted
# attribute NAMES, so iteration order is load-bearing. Default features off:
# they pull in the crate's CLI binary deps.
scraper = { version = "0.27.0", default-features = false, features = [
  "errors",
  "deterministic",
] }
semver = "1.0.28"
base64 = "0.22.1"
hex = "0.4.3"
once_cell = "1.21.4"
flate2 = "1.1.9"
hmac = "0.13.0"
sha2 = "0.11.0"

# Torrent / media
# librqbit 9.x pre-release — pinned to the published `9.0.0-rc.0` (release
# candidate, opted in deliberately; the user runs the 9.x line). It ships
# `client_name_and_version()` + `SessionOptions::client_name_and_version`
# (PR 577) — needed because UNIT3D-Announce trackers (e.g. theoldschool.cc)
# reject HTTP announces with absent/long User-Agents, and 8.x had no public
# knob. The git patch is gone now that the option is in a published crate;
# bump to the stable 9.0.0 once ikatson ships it.
librqbit = "=9.0.0-rc.0"

# Recommendation — static text embeddings (model2vec). Official Rust impl,
# CPU-only lookup-table inference; see crates/iris-reco + RECOSYS.md §4.
model2vec-rs = "0.2.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
