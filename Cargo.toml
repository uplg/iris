[workspace]
resolver = "3"
members = [
    "crates/iris-core",
    "crates/iris-config",
    "crates/iris-db",
    "crates/iris-auth",
    "crates/iris-providers",
    "crates/iris-torrent",
    "crates/iris-media",
    "crates/iris-caps",
    "crates/iris-api",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# Local crates
iris-core = { path = "crates/iris-core" }
iris-config = { path = "crates/iris-config" }
iris-db = { path = "crates/iris-db" }
iris-auth = { path = "crates/iris-auth" }
iris-providers = { path = "crates/iris-providers" }
iris-torrent = { path = "crates/iris-torrent" }
iris-media = { path = "crates/iris-media" }
iris-caps = { path = "crates/iris-caps" }

# Async runtime + http
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
futures = "0.3.32"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "http2"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie", "cookie-private"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.10", features = ["trace", "cors", "fs", "compression-gzip", "set-header", "normalize-path"] }
hyper = "1.9"
http = "1.4"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "query", "rustls", "gzip", "brotli", "stream", "http2"] }
bytes = "1.11"

# Serde / config
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1"
figment = { version = "0.10.19", features = ["toml", "env"] }

# DB (latest stable; 0.9 is alpha)
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "uuid", "chrono"] }

# Auth (latest stable; argon2 0.6 is rc)
argon2 = "0.5.3"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
rand = "0.10"

# Errors / logging
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Utility
chrono = { version = "0.4.44", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
url = { version = "2.5.8", features = ["serde"] }
quick-xml = "0.40"
semver = "1.0"
base64 = "0.22.1"
hex = "0.4.3"
once_cell = "1.21"

# Torrent / media
# Pinned to 9.0.0-beta.2 + our minimal UA patch (see [patch.crates-io]
# below). User explicitly opted in to the beta via the `client_name_and
# _version` field — needed because UNIT3D-Announce trackers (e.g.
# theoldschool.cc) reject HTTP announces with absent/long User-Agents,
# and 8.x has no public knob to set one. Upstream tracking issue:
# https://github.com/ikatson/rqbit/issues/473 + PR
# https://github.com/ikatson/rqbit/pull/577. Drop the patch + bump to a
# stable 9.x release once ikatson ships one with the option.
librqbit = "=9.0.0-beta.2"

# PR 577 (`SessionOptions::client_name_and_version`) was merged into
# ikatson:main but no `crates.io` release ships it yet (latest is
# 8.1.1, latest tag is `v9.0.0-beta.2` cut BEFORE the merge). Point at
# the merge commit directly until a new beta/stable is published, then
# bump and delete this block entirely.
[patch.crates-io]
librqbit = { git = "https://github.com/ikatson/rqbit.git", rev = "af966eba108f822395f65efea32bc9ec14cb8a21" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
