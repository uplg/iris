[[providers]]
id = "torr9"
kind = "torr9"
enabled = false
base_url = "https://api.torr9.net"
username_env = "TORR9_USERNAME"
password_env = "TORR9_PASSWORD"

[[providers]]
id = "c411"
kind = "c411"
enabled = true
base_url = "https://c411.org"
api_key_env = "C411_API_KEY"

# TheOldSchool — UNIT3D tracker, consumed via the native UNIT3D
# JSON:API (UNIT3D doesn't ship Torznab). Generate an API key in
# your account settings → API Tokens.
[[providers]]
id = "tos"
kind = "unit3d"
enabled = false
base_url = "https://theoldschool.cc"
api_key_env = "TOS_API_KEY"

# SeedPool — UNIT3D tracker, same native JSON:API as TOS. Generate an
# API key in your account settings → API Tokens.
[[providers]]
id = "seedpool"
kind = "unit3d"
enabled = true
base_url = "https://seedpool.org"
api_key_env = "SEEDPOOL_API_KEY"
# Seedpool ships English releases by convention without ever tagging
# the filename. Without this hint the language detector would label
# them as `unknown` (= no badge), leaving the household's anglophone
# users without a visual cue. The francophone trackers tag releases
# explicitly (VOSTFR / VFF / MULTI) so they don't need a default.
default_language = "english"

# HD-Torrents — English private HD tracker, no API at all: cookie
# session (login.php) + HTML scraping of torrents.php. Credentials are
# the site login itself, not an API key. Releases carry no language
# tag, same convention as Seedpool → default to English.
[[providers]]
id = "hdt"
kind = "hdtorrents"
enabled = true
base_url = "https://hd-torrents.org"
username_env = "HDT_USERNAME"
password_env = "HDT_PASSWORD"
default_language = "english"

# TorrentLeech — English private tracker (0DAY/GENERAL), no Torznab:
# search rides the SPA's JSON browse endpoint behind a cookie session
# (site username/password), downloads ride the per-user RSS key
# (Profile → RSS) — signed, cookie-less, restart-safe. Releases carry
# no language tag, same convention as Seedpool → default to English.
# Set the account profile to timezone UTC and "Torrents per page: 100".
#
# base_url points at a RELOAD MIRROR, not the primary www.torrentleech.org:
# in 2026-08 the primary zone got a site-wide Cloudflare *Managed Challenge*
# ("Just a moment…", cf-mitigated: challenge) that a headless HTTP client
# can't solve, so login + search return 403. The official reload mirrors
# (torrentleech.me / .cc / tleechreload.org) front the same backend with no
# challenge — login, JSON browse search, and the /rss/download grab path all
# work identically (verified end-to-end). Same account + RSS key. If a mirror
# starts challenging too, swap to another from the list. (Old persisted
# download_urls on the .org host still resolve — that path was never
# challenged.)
[[providers]]
id = "tl"
kind = "torrentleech"
enabled = true
base_url = "https://www.torrentleech.me"
username_env = "TL_USERNAME"
password_env = "TL_PASSWORD"
rss_key_env = "TL_RSS_KEY"
# alt_2fa_token_env = "TL_2FA_TOKEN"  # only when the account has 2FA enabled
default_language = "english"

# TR4KER — francophone tracker exposing a clean generic Torznab 1.3 API
# (caps, search/movie/tvsearch with season/ep, torznab:attr metadata,
# apikey-signed download links returning real bencoded .torrent files).
# `kind = "tr4ker"` composes the generic Torznab provider with a custom
# `details()` on the SPA's JSON `/api/torrents/{slug}` endpoint (rich HTML
# release page). Auth is the same key sent both as the spec `apikey=`
# query param and as the `X-Api-Key` header (the REST detail route only
# honors the header).
# `api_path = "/api/"` (trailing slash) skips the nginx 301 `/api` → `/api/`
# round-trip on every request. Parent categories include their subcats
# (cat=2000 returns 2040 items), so the provider's default 2000/5000
# buckets are correct. Releases are explicitly tagged (MULTi/VFF/VOSTFR)
# so no `default_language` hint is needed.
[[providers]]
id = "tr4ker"
kind = "tr4ker"
enabled = true
base_url = "https://tr4ker.net"
api_path = "/api/"
api_key_env = "TR4KER_API_KEY"
api_key_header = "X-Api-Key"

# YggReborn — francophone tracker exposing clean generic Torznab 1.3
# (caps, search/tvsearch with season/ep, torznab:attr seeders/peers/size,
# token-signed download links returning real bencoded .torrent files,
# guid = bare infohash → stable external_id). Standard 2000/5000 category
# buckets, so the provider defaults apply unchanged.
# base_url points at api.yggreborn.org directly: the advertised
# www.yggreborn.org/api 302-redirects there on every request.
# Tracker-side rate limits (300 queries / 120 grabs per hour) are far
# above what discovery polling + household searches generate.
# Releases are explicitly tagged (MULTI/FRENCH/VOSTFR) so no
# default_language hint is needed.
[[providers]]
id = "yggreborn"
kind = "torznab"
enabled = true
base_url = "https://api.yggreborn.org"
api_key_env = "YGGREBORN_API_KEY"

# Memphis — young francophone tracker with a partial generic Torznab:
# t=search / t=movie honor `q` (case-insensitive, separator-normalized
# substring over release names, cat filter respected) but t=tvsearch
# returns 0 hits whenever `q` is present and ignores season/ep —
# hence `tvsearch_q = false`, which routes TV queries through t=search
# with the raw SxxExx query (verified to match at episode level).
# t=tvsearch without q works and serves the latest/browse path.
# guid = "memphis-<id>" (stable), download links are apikey-signed and
# return real bencoded .torrent files. Standard 2000/5000 buckets.
# supportedParams has no limit/offset → pagination past page 1 may
# repeat items; harmless (clients dedup on provider_id:external_id).
[[providers]]
id = "memphis"
kind = "torznab"
enabled = true
base_url = "https://memphis.fit"
api_path = "/api/torznab"
api_key_env = "MEMPHIS_API_KEY"
tvsearch_q = false

# nyaa.si — public anime tracker. No API key, no account: the whole
# catalogue is a public RSS feed.
#
# Two knobs exist for exactly this provider:
#
#   catalog = false — search-only. Nyaa indexes anime and nothing else, at
#   hundreds of releases a day, so letting the freshness scheduler ingest its
#   rolling window would bury the discovery shelves under fansub raws. It
#   answers user searches and stays out of everything else (no featured
#   carousel either — it has no such concept).
#
#   seed = false — leave the swarm once the download completes. The
#   seed-stats loop pauses the torrent at completion; files stay on disk and
#   playback is untouched (it reads from disk). Removing this line makes the
#   torrent seed like any other, on the next 30 s tick.
#
# `categories` defaults to 1_0 (all anime); narrow to 1_2 for
# english-translated only. `filter`: 0 = everything, 1 = no remakes,
# 2 = trusted uploaders only.
[[providers]]
id = "nyaa"
kind = "nyaa"
enabled = true
base_url = "https://nyaa.si"
categories = "1_0"
filter = 0
catalog = false
seed = false
# Deliberately NO `default_language`: unlike Seedpool, nyaa is a MIXED
# tracker. Its `1_2` tree is english-translated, `1_3` is translated into
# something it won't name (the French fansub scene lives there — `Pandora
# Hearts - CUSTOM DVDRIP - VF VOSTFR - x264 AC3`) and `1_4` is untranslated
# raws. A single tracker-wide default would badge half of that wrong, so the
# provider emits a per-result hint from the category instead and the title's
# own VF / VOSTFR / MULTi tag always wins over it.
