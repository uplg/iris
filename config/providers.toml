[[providers]]
id = "torr9"
kind = "torr9"
enabled = true
base_url = "https://api.torr9.net"
username_env = "TORR9_USERNAME"
password_env = "TORR9_PASSWORD"

[[providers]]
id = "c411"
kind = "c411"
enabled = true
base_url = "https://c411.org"
api_key_env = "C411_API_KEY"

# TheOldSchool — UNIT3D tracker, consumed via the native UNIT3D
# JSON:API (UNIT3D doesn't ship Torznab). Generate an API key in
# your account settings → API Tokens.
[[providers]]
id = "tos"
kind = "unit3d"
enabled = true
base_url = "https://theoldschool.cc"
api_key_env = "TOS_API_KEY"

# SeedPool — UNIT3D tracker, same native JSON:API as TOS. Generate an
# API key in your account settings → API Tokens.
[[providers]]
id = "seedpool"
kind = "unit3d"
enabled = true
base_url = "https://seedpool.org"
api_key_env = "SEEDPOOL_API_KEY"
# Seedpool ships English releases by convention without ever tagging
# the filename. Without this hint the language detector would label
# them as `unknown` (= no badge), leaving the household's anglophone
# users without a visual cue. The francophone trackers tag releases
# explicitly (VOSTFR / VFF / MULTI) so they don't need a default.
default_language = "english"

# Nexum — generic Torznab indexer, consumed via the shared `torznab` kind
# (no bespoke module — see CLAUDE.md: compose `TorznabProvider`). The
# endpoint is https://nexum-core.com/api/torznab; `Url::join` replaces the
# path, so `base_url` is the bare origin and `api_path` carries the rest.
# Drop the key into `.env` as NEXUM_API_KEY before deploying — until it's
# set the registry logs one line and skips this provider (it never crashes
# boot). Categories default to the Torznab spec buckets (2xxx movies / 5xxx
# tv); override only if Nexum uses non-standard codes.
[[providers]]
id = "nexum"
kind = "torznab"
enabled = true
base_url = "https://nexum-core.com"
api_path = "/api/torznab"
api_key_env = "NEXUM_API_KEY"
