[[providers]]
id = "torr9"
kind = "torr9"
enabled = true
base_url = "https://api.torr9.net"
username_env = "TORR9_USERNAME"
password_env = "TORR9_PASSWORD"

[[providers]]
id = "c411"
kind = "c411"
enabled = true
base_url = "https://c411.org"
api_key_env = "C411_API_KEY"

# TheOldSchool — UNIT3D tracker, consumed via the native UNIT3D
# JSON:API (UNIT3D doesn't ship Torznab). Generate an API key in
# your account settings → API Tokens.
[[providers]]
id = "tos"
kind = "unit3d"
enabled = true
base_url = "https://theoldschool.cc"
api_key_env = "TOS_API_KEY"

# SeedPool — UNIT3D tracker, same native JSON:API as TOS. Generate an
# API key in your account settings → API Tokens.
[[providers]]
id = "seedpool"
kind = "unit3d"
enabled = true
base_url = "https://seedpool.org"
api_key_env = "SEEDPOOL_API_KEY"
# Seedpool ships English releases by convention without ever tagging
# the filename. Without this hint the language detector would label
# them as `unknown` (= no badge), leaving the household's anglophone
# users without a visual cue. The francophone trackers tag releases
# explicitly (VOSTFR / VFF / MULTI) so they don't need a default.
default_language = "english"

# HD-Torrents — English private HD tracker, no API at all: cookie
# session (login.php) + HTML scraping of torrents.php. Credentials are
# the site login itself, not an API key. Releases carry no language
# tag, same convention as Seedpool → default to English.
[[providers]]
id = "hdt"
kind = "hdtorrents"
enabled = true
base_url = "https://hd-torrents.org"
username_env = "HDT_USERNAME"
password_env = "HDT_PASSWORD"
default_language = "english"

# TorrentLeech — English private tracker (0DAY/GENERAL), no Torznab:
# search rides the SPA's JSON browse endpoint behind a cookie session
# (site username/password), downloads ride the per-user RSS key
# (Profile → RSS) — signed, cookie-less, restart-safe. Releases carry
# no language tag, same convention as Seedpool → default to English.
# Set the account profile to timezone UTC and "Torrents per page: 100".
[[providers]]
id = "tl"
kind = "torrentleech"
enabled = true
base_url = "https://www.torrentleech.org"
username_env = "TL_USERNAME"
password_env = "TL_PASSWORD"
rss_key_env = "TL_RSS_KEY"
# alt_2fa_token_env = "TL_2FA_TOKEN"  # only when the account has 2FA enabled
default_language = "english"

# TR4KER — francophone tracker exposing a clean generic Torznab 1.3 API
# (caps, search/movie/tvsearch with season/ep, torznab:attr metadata,
# apikey-signed download links returning real bencoded .torrent files).
# `kind = "tr4ker"` composes the generic Torznab provider with a custom
# `details()` on the SPA's JSON `/api/torrents/{slug}` endpoint (rich HTML
# release page). Auth is the same key sent both as the spec `apikey=`
# query param and as the `X-Api-Key` header (the REST detail route only
# honors the header).
# `api_path = "/api/"` (trailing slash) skips the nginx 301 `/api` → `/api/`
# round-trip on every request. Parent categories include their subcats
# (cat=2000 returns 2040 items), so the provider's default 2000/5000
# buckets are correct. Releases are explicitly tagged (MULTi/VFF/VOSTFR)
# so no `default_language` hint is needed.
[[providers]]
id = "tr4ker"
kind = "tr4ker"
enabled = true
base_url = "https://tr4ker.net"
api_path = "/api/"
api_key_env = "TR4KER_API_KEY"
api_key_header = "X-Api-Key"
