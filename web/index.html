<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Iris</title>
    <script>
      // Apply persisted display preferences (theme + accent + density) before
      // React mounts so we never flash the wrong color scheme or accent.
      // Mirrors the logic in src/lib/theme.tsx; the React provider takes over
      // after hydration and reacts to changes.
      (function () {
        const read = (key, allowed, fallback) => {
          let v = null;
          try {
            v = localStorage.getItem(key);
          } catch (_) {}
          return allowed.includes(v) ? v : fallback;
        };
        const theme = read("iris-theme", ["light", "dark", "system"], "system");
        const accent = read(
          "iris-accent",
          ["violet", "indigo", "emerald", "amber", "rose"],
          "violet",
        );
        const density = read("iris-density", ["comfortable", "compact"], "comfortable");
        const mql = window.matchMedia("(prefers-color-scheme: dark)");
        const root = document.documentElement;
        root.classList.toggle("dark", theme === "dark" || (theme === "system" && mql.matches));
        root.dataset.accent = accent;
        root.dataset.density = density;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
