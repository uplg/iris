<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Iris</title>
    <script>
      // Apply persisted theme preference before React mounts so we never
      // flash the wrong color scheme. Mirrors the logic in src/lib/theme.tsx;
      // the React provider takes over after hydration and reacts to changes.
      (function () {
        const KEY = "iris-theme";
        let stored = null;
        try {
          stored = localStorage.getItem(KEY);
        } catch (_) {}
        if (stored !== "light" && stored !== "dark" && stored !== "system") {
          stored = "system";
        }
        const mql = window.matchMedia("(prefers-color-scheme: dark)");
        const dark = stored === "dark" || (stored === "system" && mql.matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
