<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Iris mark: a gradient diamond on the slate ground, shared with the
       Android launcher icon. Brand ramp indigo→violet→fuchsia (see
       ui/theme/Color.kt). Solid fill so it stays legible down to 16px. -->
  <defs>
    <linearGradient id="iris-brand" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F08FE8"/>
      <stop offset=".5" stop-color="#A58DFF"/>
      <stop offset="1" stop-color="#69C1FC"/>
    </linearGradient>
    <clipPath id="iris-clip"><rect width="48" height="48" rx="11"/></clipPath>
  </defs>
  <g clip-path="url(#iris-clip)">
    <rect width="48" height="48" fill="#0B0C10"/>
    <circle cx="35" cy="12" r="24" fill="#A58DFF" opacity="0.20"/>
    <path d="M24 7 41 24 24 41 7 24Z" fill="url(#iris-brand)"/>
    <path d="M24 7 41 24 7 24Z" fill="#FFFFFF" opacity="0.12"/>
  </g>
</svg>
