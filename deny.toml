# cargo-deny configuration. Run: cargo deny check

[advisories]
yanked = "deny"
# Each ignore is a known, fix-less transitive advisory we've reviewed. Revisit
# whenever a dependency (esp. librqbit) bumps.
ignore = [
    # ringbuf < 0.5.2 `Consumer::skip`/`clear` double free when an element's
    # `Drop` panics. Transitive via librqbit-utp 0.7.0 (ringbuf 0.4.8; the fix
    # is 0.5-only). Unreachable here: librqbit-utp's only ring buffers are
    # `SharedRb<Heap<u8>>`, and `u8` has no `Drop`. Drop this entry once
    # librqbit-utp moves to ringbuf >= 0.5.2.
    "RUSTSEC-2026-0293",
    # rsa Marvin attack: timing recovers a private key. Transitive via
    # webauthn-rs 0.6 → crypto-glue (rsa 0.10.0-rc). Unreachable here: the
    # server only verifies RS256 signatures with public keys and holds no RSA
    # private key. Drop this entry once rsa ships a fix.
    "RUSTSEC-2023-0071",
    # Bundled SQLite < 3.54.0 can return stale process memory when it opens a
    # database next to a crafted `-wal` of another page size. Transitive via
    # sqlx 0.9.0, which caps libsqlite3-sys below 0.38 (the fix is 0.39).
    # Unreachable here: the server only opens the database it wrote itself in
    # its own data dir. Drop this entry once sqlx accepts libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]

[licenses]
# Permissive (and public-domain-equivalent) licenses we accept. Crates offering
# a choice (e.g. "Unlicense OR MIT") are satisfied via one of these.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots / webpki-root-certs (the Mozilla CA bundle, via rustls).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
wildcards = "deny"
allow-wildcard-paths = true
# Surface duplicate crate versions without failing the gate: librqbit and
# sqlx still pull older majors of the RustCrypto / rand / windows-sys stacks
# that we can't dedupe ourselves. Tighten to "deny" + an explicit skip-list
# once that set is small.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
