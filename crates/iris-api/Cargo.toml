[package]
name = "iris-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
iris-core = { workspace = true }
iris-config = { workspace = true }
iris-db = { workspace = true }
iris-auth = { workspace = true }
iris-providers = { workspace = true }
iris-torrent = { workspace = true }
iris-media = { workspace = true }
iris-caps = { workspace = true }
iris-reco = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = "0.8"
hyper = { workspace = true }
http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }

clap = { version = "4.6.1", features = ["derive", "env"] }
# `time` 0.3.52 changed `Parsable::parse`'s signature (added a required
# `Option<Parsed>` defaults param) — a breaking change inside what semver
# treats as a same-line 0.3.x patch bump. `cookie 0.18.1` (the latest
# release, pulled in via axum-extra's cookie/cookie-private features) calls
# the old 1-arg form and fails to compile against it. No fixed `cookie`
# release exists yet. Pinned below the break; revisit when cookie adapts.
time = ">=0.3.49, <0.3.52"
reqwest = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
utoipa = { workspace = true }
