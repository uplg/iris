[package]
name = "iris-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
iris-core = { workspace = true }
iris-config = { workspace = true }
iris-db = { workspace = true }
iris-auth = { workspace = true }
iris-providers = { workspace = true }
iris-torrent = { workspace = true }
iris-media = { workspace = true }
iris-caps = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
webauthn-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }
openssl = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = "0.8"
# Only to name tower_governor's config types (same version + features it pulls).
governor = "0.10.4"
hyper = { workspace = true }
http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }

clap = { version = "4.6.6", features = ["derive", "env"] }
# Cookie Max-Age plumbing (axum-extra cookies speak `time`, not chrono).
time = "0.3.55"
reqwest = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
# Accent folding for the TMDB trust gate's title comparison.
unicode-normalization = "0.1.25"
utoipa = { workspace = true }

# Live TV: playlist proxy signing + XMLTV guide decoding
url = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
rustix = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
iris-db = { workspace = true, features = ["test-support"] }
passkey = { workspace = true }
async-trait = { workspace = true }
