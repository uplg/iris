[versions]
# Toolchain (verified 2026-10-01 against maven central + maven.google.com)
agp = "9.4.1"               # latest stable; 9.5.0 is alpha-only — hold per "no RC/alpha" rule
kotlin = "2.4.20"

# AndroidX core
# core-ktx 1.19 + lifecycle 2.11 require compileSdk 37 (bumped below).
core-ktx = "1.19.1"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
nav-compose = "2.10.2"        # minSdk 24 floor (the app moved there for it)

# Tests
junit = "4.13.2"
kotlinx-coroutines = "1.11.0"   # coroutines-test only; the runtime comes transitively
# Screenshot tests on the JVM (verified 2026-10-06 on maven central): Robolectric
# renders the composables, Roborazzi records and verifies the PNGs.
robolectric = "4.17"
roborazzi = "1.76.0"
androidx-test-ext-junit = "1.3.0"

# Baseline profiles (verified 2026-10-06 on maven.google.com)
baselineprofile = "1.5.0"      # the plugin and benchmark-macro-junit4 share it
uiautomator = "2.4.0"
profileinstaller = "1.4.1"

# Compose
# BOM pins the whole compose.* family; only override individual artifacts if
# you really need a newer one. Compose-for-TV lives outside the BOM.
compose-bom = "2026.09.00"
# No tv-foundation: its TvLazy* lists are deprecated upstream; rows and grids
# use the foundation lazy lists with focusRestorer.
compose-tv-material = "1.1.0"

# Media3 (ExoPlayer)
media3 = "1.11.1"            # latest stable; bump => rebuild lib-decoder-{ffmpeg,av1} AARs (scripts/)

# Networking
# Retrofit 3.0.0 is out and works with Square's official kotlinx-serialization
# converter; we use that pair instead of JakeWharton's standalone fork.
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinx-serialization = "1.11.0"  # 1.12.0 is RC-only as of September 2026

# Persistence + images
# datastore 1.3 is alpha only as of September 2026; stay on 1.2.1.
# coil 3.x is the latest line: artifacts moved from `io.coil-kt` to
# `io.coil-kt.coil3` and now require an explicit network module.
datastore = "1.2.1"
coil = "3.6.3"

# Android TV channels (home launcher rows)
tvprovider = "1.1.0"
work = "2.12.0"

# Desugaring
# Backports java.time (used by the OpenAPI-generated DTOs) to minSdk 24.
desugar-jdk-libs = "2.1.5"

# Codegen
# Generates the @Serializable DTO layer from ../web/openapi.json (utoipa-
# derived spec). Pinned to the same release as the openapi-generator line the
# web side validates against. Models only — Retrofit interface stays hand-written.
openapi-generator = "7.25.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baselineprofile" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Material3 (mobile) — used for OutlinedTextField, LinearProgressIndicator,
# Surface inside dialogs. Compose-for-TV deliberately doesn't ship those.
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material Symbols / Icons — full set (Search, Mic, Settings, …). Lives
# under the legacy `compose.material` group, separate from material3.
# R8 strips unused icons in release.
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Compose for TV (D-pad focus, leanback-friendly components)
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "compose-tv-material" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "nav-compose" }

# Media3 player
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# Networking — Retrofit 3 ships its own kotlinx-serialization converter,
# replacing the previous JakeWharton standalone artifact.
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil 3 (TMDB poster loading + cards artwork). Three artifacts:
#   - coil-compose: AsyncImage / rememberAsyncImagePainter
#   - coil-network-okhttp: pluggable network module (Coil 3 makes networking opt-in)
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# SVG decoder — some channel logos (iptv-org) are raw .svg, which Coil can't
# render without this (a browser <img> can). See IrisApp.newImageLoader.
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }

# TV Channels (PreviewPrograms exposed on the Android TV home launcher)
tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version.ref = "tvprovider" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
