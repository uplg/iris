[versions]
# ----- Toolchain (verified June 2026 latest stables on maven central + maven.google.com) -----
agp = "9.2.1"               # latest stable; 9.3.0 is RC-only — hold per "no RC/alpha" rule
kotlin = "2.4.0"             # June 2026 (latest stable per github.com/JetBrains/kotlin)

# ----- AndroidX core -----
# core-ktx 1.19 + lifecycle 2.11 require compileSdk 37 (bumped below).
core-ktx = "1.19.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
nav-compose = "2.9.8"

# ----- Compose -----
# BOM pins the whole compose.* family; only override individual artifacts if
# you really need a newer one. Compose-for-TV lives outside the BOM.
compose-bom = "2026.06.00"
# Note: tv-foundation hasn't shipped a 1.1.0 stable as of writing — the
# androidx.tv 1.1 release line is `tv-material` only. Stay on 1.0.0 here.
compose-tv-foundation = "1.0.0"
compose-tv-material = "1.1.0"

# ----- Media3 (ExoPlayer) -----
media3 = "1.10.1"            # latest stable; bump => rebuild lib-decoder-{ffmpeg,av1} AARs (scripts/)

# ----- Networking -----
# Retrofit 3.0.0 is out and works with Square's official kotlinx-serialization
# converter; we use that pair instead of JakeWharton's standalone fork.
retrofit = "3.0.0"
okhttp = "5.4.0"
kotlinx-serialization = "1.11.0"

# ----- Persistence + images -----
# datastore 1.3 is alpha only as of June 2026; stay on 1.2.1.
# coil 3.x is the latest line: artifacts moved from `io.coil-kt` to
# `io.coil-kt.coil3` and now require an explicit network module.
datastore = "1.2.1"
coil = "3.5.0"

# ----- Android TV channels (home launcher rows) -----
tvprovider = "1.1.0"
work = "2.11.2"

# ----- Desugaring -----
# Backports java.time (used by the OpenAPI-generated DTOs) to minSdk 23.
desugar-jdk-libs = "2.1.5"

# ----- Codegen -----
# Generates the @Serializable DTO layer from ../web/openapi.json (utoipa-
# derived spec). Pinned to the same release as the openapi-generator line the
# web side validates against. Models only — Retrofit interface stays hand-written.
openapi-generator = "7.23.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Material3 (mobile) — used for OutlinedTextField, LinearProgressIndicator,
# Surface inside dialogs. Compose-for-TV deliberately doesn't ship those.
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material Symbols / Icons — full set (Search, Mic, Settings, …). Lives
# under the legacy `compose.material` group, separate from material3.
# R8 strips unused icons in release.
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Compose for TV (D-pad focus, leanback-friendly components)
tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "compose-tv-foundation" }
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "compose-tv-material" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "nav-compose" }

# Media3 player
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# Networking — Retrofit 3 ships its own kotlinx-serialization converter,
# replacing the previous JakeWharton standalone artifact.
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil 3 (TMDB poster loading + cards artwork). Three artifacts:
#   - coil-compose: AsyncImage / rememberAsyncImagePainter
#   - coil-network-okhttp: pluggable network module (Coil 3 makes networking opt-in)
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# TV Channels (PreviewPrograms exposed on the Android TV home launcher)
tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version.ref = "tvprovider" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
